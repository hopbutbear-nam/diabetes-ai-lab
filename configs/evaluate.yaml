metrics: [roc_auc_ovr, pr_auc, macro_f1, recall_per_class, precision_per_class, brier, ece]
threshold:
  method: optimize_on_val
  objective: macro_f1    # hoặc recall_at_precision
  precision_floor: 0.30
  grid:
    s_pre: [0.5, 30.0, 41]   # geomspace(start, stop, num)
    s_dia: [0.5, 8.0, 33]
fairness_groups: [Age, Sex, Income]
fairness:
  min_pos: 30
  age_groups:
    "18-34": [1, 2, 3]
    "35-44": [4, 5]
    "45-54": [6, 7]
    "55-64": [8, 9]
    "65-74": [10, 11]
    "75+": [12, 13]
  income_groups:
    "<25k": [1, 2, 3, 4]
    "25-50k": [5, 6]
    ">=50k": [7, 8]
  sex_groups:
    "Nữ": [0]
    "Nam": [1]
test:
  runs: [multiclass_full, binary_full, multiclass_dedup]
  lock_file: reports/metrics/test_lock.json
bootstrap:
  n: 1000
  ci: 0.95
  seed: 42
calibration:
  candidates: [logit_multinomial, isotonic_ovr]
  n_bins: 10
  n_splits: 5
selection:
  metric: val_auc_ovr
  simplicity_margin: 0.003
  prefer_order: [logreg, xgb, mlp]
