[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-ai"
version = "0.1.0"
description = "Sàng lọc nguy cơ đái tháo đường từ chỉ số sức khỏe (dự án học tập)"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = [
    "real_data: cần CSV thật trong data/raw/",
]
